<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select Your Stops | Nammade Bus</title>
<meta name="description" content="Pick your boarding stop and destination to see the next bus and full schedule on Nammade Bus.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2f7bff">
<link rel="canonical" href="https://jerin37sebastian.github.io/Nammade-bus/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("nb-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24" width="30" height="30"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <div class="brand">
    <p class="logo">Nammade Bus</p>
    <p class="tag">Community travel</p>
  </div>
  <span class="deco" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="13" rx="3"/><path d="M4 10h16M8 19v2M16 19v2"/><circle cx="8.5" cy="13" r=".6"/><circle cx="15.5" cy="13" r=".6"/></svg>
  </span>
</header>

<nav class="drawer" id="drawer" aria-label="Main menu" hidden>
  <a href="#" id="supportLink">Support developer</a>
  <button type="button" id="shareMenu">Share Nammade Bus</button>
  <a href="about.html">About</a>
  <a href="privacy.html">Privacy policy &amp; disclaimer</a>
  <a href="reviews.html">Review</a>
</nav>
<div class="scrim" id="scrim" hidden></div>

<div class="float-stack" aria-label="Quick actions">
  <button class="fab" id="themeBtn" aria-label="Switch light or dark mode">
    <svg class="i-moon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="fab" id="shareBtn" aria-label="Share Nammade Bus">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
  </button>
  <button class="fab" id="likeBtn" aria-label="Like Nammade Bus" aria-pressed="false">
    <!-- placeholder thumb: replace with your own icon file later -->
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3zm0 0l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></svg>
    <span class="like-count" id="likeCount" hidden></span>
  </button>
</div>

<main>
  <a class="back" href="index.html">&larr; Home</a>

  <section class="card label-card" aria-labelledby="routeLabel">
    <h1 class="route-label" id="routeLabel">Route</h1>
    <p class="route-note" id="routeNote">Loading stops...</p>
  </section>

  <section class="card selector" id="selector" aria-labelledby="selTitle">
    <h2 id="selTitle">Select your stops :</h2>
    <label class="sel-label" for="fromSel">From (start point)</label>
    <div class="sel-wrap"><select id="fromSel"></select></div>
    <button class="swap" id="swapBtn" aria-label="Swap start and destination">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/></svg>
    </button>
    <label class="sel-label" for="toSel">To (destination)</label>
    <div class="sel-wrap"><select id="toSel"></select></div>
    <button class="go" id="startBtn">Start journey</button>
    <p class="fine">* Schedules are approximate. May change due to traffic and weather condition.</p>
  </section>

  <aside class="card ad" id="ad" hidden aria-label="Partner shop">
    <div class="ad-logo" id="adLogo">KS</div>
    <div><p class="ad-tag">Partner shop</p><p class="ad-name" id="adName"></p><p class="ad-text" id="adText"></p></div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
<script src="js/firebase-config.js" defer></script>
<script src="js/common.js" defer></script>
<script src="js/select-stops.js" defer></script>
<script>
/* Self-check: if the stops never load, say which file is the problem. */
(function(){var bad=[];
[].forEach.call(document.scripts,function(s){if(s.src)s.addEventListener("error",function(){bad.push(s.getAttribute("src"))})});
addEventListener("load",function(){setTimeout(function(){
var n=document.getElementById("routeNote");
if(!n||n.textContent!=="Loading stops...")return;
try{performance.getEntriesByType("resource").forEach(function(e){if(/\/js\//.test(e.name)&&e.responseStatus>=400){var f=e.name.split("/").slice(-2).join("/");if(bad.indexOf(f)<0)bad.push(f)}})}catch(x){}
n.textContent=bad.length?"These files did not load: "+bad.join(", ")+". Check their names and folders in your repo.":(window.NB?"The page script did not start. Press F12 and read the red error in Console.":"js/common.js did not run. Press F12 and read the red error in Console.");
},2500)})})();
</script>
</body>
</html>
